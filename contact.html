<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ — Bravemath</title>
    <meta name="description" content="Liên hệ với Bravemath để góp ý, đóng góp tài liệu toán học hoặc báo lỗi.">
    <link rel="canonical" href="https://bravee9.github.io/bravemath/contact.html">
    <link rel="stylesheet" href="./src/css/styles.css">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PXJXVDWLCG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date()); gtag('config', 'G-PXJXVDWLCG');
    </script>
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
            <nav class="nav-links">
                <a href="/bravemath/index.html" class="nav-link">Trang chủ</a>
                <a href="/bravemath/about.html" class="nav-link">Giới thiệu</a>
                <a href="/bravemath/how-to-use.html" class="nav-link">Hướng dẫn</a>
                <a href="/bravemath/contact.html" class="nav-link active">Liên hệ</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Chuyển chế độ sáng/tối">
                    <svg class="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
                    <svg class="icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
            </nav>
            <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Menu">
                <svg width="24" height="24" fill="none" stroke="#3c4043" viewBox="0 0 24 24" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            </button>
        </div>
        <div id="mobile-menu" class="mobile-menu">
            <a href="/bravemath/index.html" class="mobile-nav-link">Trang chủ</a>
            <a href="/bravemath/about.html" class="mobile-nav-link">Giới thiệu</a>
            <a href="/bravemath/how-to-use.html" class="mobile-nav-link">Hướng dẫn sử dụng</a>
            <a href="/bravemath/contact.html" class="mobile-nav-link">Liên hệ</a>
        </div>
    </header>

    <!-- Main -->
    <main class="site-section">
        <div class="site-container" style="max-width:520px;">
            <h1 style="font-size:28px; margin-bottom:8px;">Liên hệ</h1>
            <p style="color:var(--color-text-subtle); margin-bottom:24px;">
                Có câu hỏi hoặc góp ý? Gửi tin nhắn cho mình bên dưới.
            </p>

            <form action="https://formspree.io/f/xjgkkqzp" method="POST" style="display:flex; flex-direction:column; gap:12px;">
                <input type="text" name="name" placeholder="Tên của bạn" required class="input-field">
                <input type="email" name="email" placeholder="Email của bạn" required class="input-field">
                <textarea name="message" placeholder="Nội dung liên hệ" required class="input-field"></textarea>
                <button type="submit" class="btn-primary" style="width:100%; margin-top:4px;">Gửi liên hệ</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="site-container">
            <div class="footer-copy">
                <p>&copy; 2025 Bravemath</p>
                <p>Phát triển bởi <a href="https://www.facebook.com/buiquangchienhus" target="_blank" rel="noopener noreferrer">Bùi Quang Chiến</a></p>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
            const menu = document.getElementById('mobile-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        });
        const saved = localStorage.getItem('bravemath-theme');
        if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('theme-toggle')?.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('bravemath-theme', 'light'); }
            else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('bravemath-theme', 'dark'); }
        });
    </script>
</body>
</html>
